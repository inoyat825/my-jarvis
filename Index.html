
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b16;
    color: #00d9ff;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 25px;
    font-size: 30px;
    letter-spacing: 5px;
    text-shadow: 0 0 15px #00d9ff;
}

.circle {
    width: 190px;
    height: 190px;
    border: 3px solid #00d9ff;
    border-radius: 50%;
    margin: 65px auto 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    box-shadow: 0 0 35px #007bff;
}

button {
    background: transparent;
    color: #00d9ff;
    border: 2px solid #00d9ff;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 18px;
    margin: 10px;
}

button:active {
    background: #003c55;
}

#answer {
    margin: 35px 20px;
    font-size: 17px;
    color: white;
}

footer {
    margin-top: 90px;
    color: #607080;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S.</header>

<div class="circle">◉</div>

<h2>PERSONAL AI SYSTEM</h2>

<p id="status">SYSTEM ONLINE</p>

<button onclick="startListening()">🎙️ TALK</button>

<div id="answer">
    Здравствуйте. Я JARVIS.
    Чем могу помочь?
</div>

<footer>JARVIS SYSTEM v1.0</footer>

<script>
function speak(text) {
    document.getElementById("answer").innerText = text;

    let voice = new SpeechSynthesisUtterance(text);
    voice.lang = "ru-RU";
    speechSynthesis.speak(voice);
}

function startListening() {
    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        speak("Ваш браузер не поддерживает распознавание голоса.");
        return;
    }

    let recognition = new Recognition();
    recognition.lang = "ru-RU";

    recognition.onstart = function() {
        document.getElementById("status").innerText =
            "LISTENING...";
    };

    recognition.onresult = function(event) {
        let command = event.results[0][0].transcript.toLowerCase();

        if (command.includes("привет")) {
            speak("Здравствуйте. Я готов к работе.");
        } else if (command.includes("как дела")) {
            speak("Все системы работают нормально.");
        } else if (command.includes("твоё имя")) {
            speak("Меня зовут JARVIS.");
        } else {
            speak("Команда получена. Пока я учусь.");
        }
    };

    recognition.onerror = function() {
        speak("Не удалось распознать команду.");
    };

    recognition.onend = function() {
        document.getElementById("status").innerText =
            "SYSTEM ONLINE";
    };

    recognition.start();
}
</script>

</body>
</html>
