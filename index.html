<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050b14;
  color: #00d9ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 500px;
  text-align: center;
}

h1 {
  font-size: 36px;
  letter-spacing: 8px;
  text-shadow: 0 0 15px #00d9ff;
}

.subtitle {
  letter-spacing: 4px;
  color: #8caeba;
  font-size: 12px;
}

.status {
  margin: 25px 0;
  color: #00ff9d;
}

.orb {
  width: 110px;
  height: 110px;
  border: 2px solid #00d9ff;
  border-radius: 50%;
  margin: 25px auto;
  box-shadow: 0 0 30px #007caa;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
}

.chat {
  height: 300px;
  overflow-y: auto;
  border: 1px solid #07516b;
  border-radius: 12px;
  padding: 15px;
  text-align: left;
  background: #081421;
  margin: 20px 0;
}

.message {
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  color: #fff;
}

.jarvis {
  color: #00d9ff;
}

.controls {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #00aaca;
  background: #081421;
  color: white;
  font-size: 16px;
}

button {
  border: 1px solid #00d9ff;
  background: #063047;
  color: #00d9ff;
  padding: 13px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}

.voice {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
}

#statusText {
  color: #8caeba;
  font-size: 13px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="app">

<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">PERSONAL AI SYSTEM</div>

<div class="status">● SYSTEM ONLINE</div>

<div class="orb">◉</div>

<div class="chat" id="chat">
  <div class="message jarvis">
    JARVIS: Здравствуйте. Я JARVIS. Чем могу помочь?
  </div>
</div>

<div class="controls">
  <input id="message" placeholder="Напишите сообщение...">
  <button id="sendButton" onclick="sendMessage()">➤</button>
</div>

<button class="voice" onclick="startVoice()">🎙️ TALK</button>

<div id="statusText">Система готова к работе.</div>

</div>

<script>
const API = "https://patient-bush-7d0djarvis-api.inoyatv.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("statusText");
const sendButton = document.getElementById("sendButton");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = (type === "user" ? "ВЫ: " : "JARVIS: ") + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  sendButton.disabled = true;
  statusText.textContent = "JARVIS думает...";

  const reply = addMessage("Обрабатываю запрос...", "jarvis");

  try {
    const response = await fetch(API + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok || !data.answer) {
      throw new Error(data.error || "Ошибка ответа");
    }

    reply.textContent = "JARVIS: " + data.answer;
    statusText.textContent = "Ответ готов.";

    speak(data.answer);

  } catch (error) {
    reply.textContent = "JARVIS: Не удалось подключиться. Проверьте соединение.";
    statusText.textContent = "Ошибка подключения.";
  }

  sendButton.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

async function speak(text) {
  try {
    const response = await fetch(API + "/speak", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    if (!response.ok) throw new Error("Voice error");

    const blob = await response.blob();
    const audioURL = URL.createObjectURL(blob);
    const audio = new Audio(audioURL);

    audio.onended = () => URL.revokeObjectURL(audioURL);
    await audio.play();

  } catch (error) {
    statusText.textContent = "Текст готов. Не удалось воспроизвести голос.";
  }
}

function startVoice() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    statusText.textContent =
      "Голосовой ввод не поддерживается этим браузером. Используйте текст.";
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "ru-RU";
  recognition.interimResults = false;

  recognition.onstart = () => {
    statusText.textContent = "Слушаю вас...";
  };

  recognition.onresult = (event) => {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    statusText.textContent = "Не удалось распознать голос.";
  };

  recognition.start();
}
</script>

</body>
</html>
